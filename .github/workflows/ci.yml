name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install optional dependencies
        run: pip install -r requirements-optional.txt
        continue-on-error: true

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install optional dependencies
        run: pip install -r requirements-optional.txt
        continue-on-error: true

      - name: Build with PyInstaller
        run: pyinstaller DecentSamplerEditor.spec

      - name: Archive build (Linux)
        if: runner.os == 'Linux'
        run: tar -czf DecentSampler-Editor-linux.tar.gz -C dist DecentSamplerEditor

      - name: Archive build (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../DecentSampler-Editor-macos.zip DecentSamplerEditor.app

      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\DecentSamplerEditor -DestinationPath DecentSampler-Editor-windows.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DecentSampler-Editor-linux
          path: DecentSampler-Editor-linux.tar.gz

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DecentSampler-Editor-macos
          path: DecentSampler-Editor-macos.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DecentSampler-Editor-windows
          path: DecentSampler-Editor-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/DecentSampler-Editor-linux/DecentSampler-Editor-linux.tar.gz \
            artifacts/DecentSampler-Editor-macos/DecentSampler-Editor-macos.zip \
            artifacts/DecentSampler-Editor-windows/DecentSampler-Editor-windows.zip \
            --repo "${{ github.repository }}"
