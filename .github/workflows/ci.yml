name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install optional dependencies
        run: pip install -r requirements-optional.txt
        continue-on-error: true

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen
